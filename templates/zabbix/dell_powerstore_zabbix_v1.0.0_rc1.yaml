        trigger_prototypes:
        - uuid: 19d60aa95d81471c9f89f61757783d3b
          name: 'Replication {#RESOURCE_TYPE} [{#LOCAL_RESOURCE_ID}]: State requires attention'
          expression: find(/Dell PowerStore NAS by exporter HTTP/powerstore.nas.replication.state[{#SESSION_ID}],,"regexp","^(OK|Synchronizing)$")=0
          priority: WARNING
          tags:
          - tag: Application
            value: replication
          - tag: Resource type
            value: '{#RESOURCE_TYPE}'
          - tag: Replication role
            value: '{#ROLE}'
        - uuid: c57c92a7c4334206a289807b65aa5992
