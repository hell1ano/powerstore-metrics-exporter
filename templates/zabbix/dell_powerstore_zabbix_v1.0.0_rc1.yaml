        - macro: '{#ARRAYIP}'
          value: ^{$PST_IP}$
          operator: MATCHES_REGEX
          formulaid: A
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'var data = JSON.parse(value);

