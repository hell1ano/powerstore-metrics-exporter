        - '{__name__="powerstore_metricNas_avg_total_iops"}'
        type: PROMETHEUS_TO_JSON
      type: DEPENDENT
      uuid: 73ade1a526fe4d9ca690d6fcad2838d3
    - uuid: 46b56051968f410d81d6a2ebb2ea196a
      name: NAS and filesystem replication discovery (Source, NAS scoped)
      type: DEPENDENT
      key: powerstore.replication.nas.discovery
      delay: '0'
      master_item:
        key: powerstore.replication.raw
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "var lines=value.split(\"\\n\"), ok=false, sessions=[], nasid=\"{$POWERSTORE.NAS.ID}\";\nfor(var i=0;i<lines.length;i++)\
          \ if(/^powerstore_collector_success\\{/.test(lines[i]) && /collector=\"replication\"/.test(lines[i]) &&\
          \ /\\}\\s+1(?:\\.0+)?\\s*$/.test(lines[i])) ok=true;\nif(!ok) throw \"Replication collector not healthy\"\
          ;\nfor(var i=0;i<lines.length;i++) {\n var m=lines[i].match(/^powerstore_replication_session_info\\{(.*)\\\
          }\\s+1(?:\\.0+)?\\s*$/);\n if(!m) continue;\n var labels={}, rx=/([a-zA-Z_]+)=\"([^\"\\\\]*(?:\\\\.[^\"\
          \\\\]*)*)\"/g, v;\n while((v=rx.exec(m[1]))!==null) labels[v[1]]=v[2];\n if(labels.role!==\"Source\")\
          \ continue;\n sessions.push(labels);\n}\nvar parents={};\nfor(var i=0;i<sessions.length;i++) if(sessions[i].resource_type===\"\
          nas_server\" && sessions[i].local_resource_id===nasid) parents[sessions[i].session_id]=true;\nvar result=[];\n\
          for(var i=0;i<sessions.length;i++) {\n var s=sessions[i];\n if(!((s.resource_type===\"nas_server\" &&\
          \ s.local_resource_id===nasid) || (s.resource_type===\"file_system\" && parents[s.parent_session_id])))\
          \ continue;\n result.push({\"{#SESSION_ID}\":s.session_id,\"{#RESOURCE_TYPE}\":s.resource_type,\"{#LOCAL_RESOURCE_ID}\"\
          :s.local_resource_id,\"{#ROLE}\":s.role,\"{#REPLICATION_TYPE}\":s.type,\"{#PARENT_SESSION_ID}\":s.parent_session_id});\n\
          }\nreturn JSON.stringify(result);"
