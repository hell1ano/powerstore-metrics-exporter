          value: '{#APP_ID}'
        - tag: Application
          value: capacity
        type: DEPENDENT
        units: B
        uuid: dc4fbe8651f04224a3e8f8bc3c86b557
        value_type: FLOAT
      - delay: 5m
        key: powerstore.capacity.last.physical.free.[{#APP_ID}]
        name: Appliance [{#APP_ID}]:Last Physical Free
        params: last(//powerstore.capacity.last.physical.total.[{#APP_ID}])-last(//powerstore.capacity.last.physical.used.[{#APP_ID}])
        tags:
        - tag: Appliance
          value: '{#APP_ID}'
        - tag: Application
          value: capacity
        type: CALCULATED
        units: B
        uuid: 1536506b39e94014b6d94f2cf05218d6
        value_type: FLOAT
      - delay: 10m
        key: powerstore.capacity.last.physical.percent.used.[{#APP_ID}]
        name: Appliance [{#APP_ID}]:Last Physical Percent Used
        params: 100*(last(//powerstore.capacity.last.physical.used.[{#APP_ID}])/last(//powerstore.capacity.last.physical.total.[{#APP_ID}]))
        tags:
        - tag: Appliance
          value: '{#APP_ID}'
        - tag: Application
          value: capacity
        trigger_prototypes:
        - dependencies:
          - expression: last(/Dell PowerStore by exporter HTTP/powerstore.capacity.last.physical.percent.used.[{#APP_ID}])>={$POWERSTORE.CAPACITY.HIGH}
            name: Appliance [{#APP_ID}] Physical Capacity Used Over 90%
          - expression: last(/Dell PowerStore by exporter HTTP/powerstore.capacity.last.physical.percent.used.[{#APP_ID}])>={$POWERSTORE.CAPACITY.DISASTER}
            name: Appliance [{#APP_ID}] Physical Capacity Used Over 95%
          expression: last(/Dell PowerStore by exporter HTTP/powerstore.capacity.last.physical.percent.used.[{#APP_ID}])>={$POWERSTORE.CAPACITY.WARN}
          manual_close: 'YES'
          name: Appliance [{#APP_ID}] Physical Capacity Used Over 80%
          priority: WARNING
          uuid: 8dd1d4a7a1e74f92a3a3a54587b25d46
        - dependencies:
          - expression: last(/Dell PowerStore by exporter HTTP/powerstore.capacity.last.physical.percent.used.[{#APP_ID}])>={$POWERSTORE.CAPACITY.DISASTER}
            name: Appliance [{#APP_ID}] Physical Capacity Used Over 95%
          expression: last(/Dell PowerStore by exporter HTTP/powerstore.capacity.last.physical.percent.used.[{#APP_ID}])>={$POWERSTORE.CAPACITY.HIGH}
          manual_close: 'YES'
          name: Appliance [{#APP_ID}] Physical Capacity Used Over 90%
          priority: AVERAGE
          uuid: 96be4b4787244b6f9575120916d5ebca
        - expression: last(/Dell PowerStore by exporter HTTP/powerstore.capacity.last.physical.percent.used.[{#APP_ID}])>={$POWERSTORE.CAPACITY.DISASTER}
          manual_close: 'YES'
          name: Appliance [{#APP_ID}] Physical Capacity Used Over 95%
          priority: DISASTER
          uuid: 0ec298f8b9dc4324aa472f2f66c9c120
        type: CALCULATED
        units: '%'
        uuid: 6e17f73a4f2e4acb9c4bd36053f471be
        value_type: FLOAT
