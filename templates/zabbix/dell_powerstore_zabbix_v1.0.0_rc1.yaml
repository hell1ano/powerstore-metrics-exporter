        master_item:
          key: powerstore.port
        name: '({#APP_ID}) EthPort [{#ETHNAME}]: Is Link Up'
        preprocessing:
        - parameters:
          - powerstore_eth_port_is_link_up{IP="{$PST_IP}",appliance_id="{#APP_ID}",eth_port_id="{#ETHNAME}"}
          - value
          - ''
          type: PROMETHEUS_PATTERN
        tags:
        - tag: Appliance
          value: '{#APP_ID}'
        - tag: Application
          value: ethport
        trigger_prototypes:
        - expression: last(/Dell PowerStore by exporter HTTP/powerstore.ethport.islinkup.[{#APP_ID}_{#ETHNAME}])=0
            and max(/Dell PowerStore by exporter HTTP/powerstore.ethport.islinkup.[{#APP_ID}_{#ETHNAME}],7d)=1
          manual_close: 'YES'
          name: ({#APP_ID}) EthPort [{#ETHNAME}] Link status is abnormal
          priority: WARNING
          uuid: dbfe914422394871a6eb5e2751a30286
          description: Alerts only if the port is currently down and has been up within the last 7 days. A continuously
            down port stops alerting after 7 days. Item history is retained for 30 days.
        type: DEPENDENT
        uuid: 13a6179ed9fc4539842ef252a723c67e
        valuemap:
          name: Port Link Value Mapping
        history: 30d
      key: powerstore.ethport.discovery
      lld_macro_paths:
      - lld_macro: '{#APP_ID}'
        path: $.labels["appliance_id"]
      - lld_macro: '{#ETHNAME}'
        path: $.labels["eth_port_id"]
      - lld_macro: '{#HELP}'
        path: $["help"]
      - lld_macro: '{#NAME}'
        path: $["name"]
      master_item:
        key: powerstore.port
      name: EthPort Discovery
      preprocessing:
      - parameters:
        - '{__name__=~"^powerstore_eth_port_is_link_up",IP="{$PST_IP}"}'
        type: PROMETHEUS_TO_JSON
      type: DEPENDENT
      uuid: 3860a03b901c4ec3a7aaf831b0796190
      filter:
        evaltype: AND
        conditions:
        - macro: '{#ETHNAME}'
          value: '{$POWERSTORE.PORT.MATCHES}'
          operator: MATCHES_REGEX
          formulaid: A
        - macro: '{#ETHNAME}'
          value: '{$POWERSTORE.PORT.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
          formulaid: B
