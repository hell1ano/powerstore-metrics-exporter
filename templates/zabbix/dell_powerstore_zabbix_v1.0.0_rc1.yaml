          value: '{#APP_ID}'
        - tag: Application
          value: driver
        trends: '0'
        type: DEPENDENT
        uuid: ee73091c3f6a44b6b146cb8ec0b25442
        value_type: TEXT
      key: powerstore.drives.discovery
      lld_macro_paths:
      - lld_macro: '{#APP_ID}'
