          expression: nodata(/Dell PowerStore NAS by exporter HTTP/powerstore.nas.replication.state[{#SESSION_ID}],{$POWERSTORE.NODATA})=1
          priority: AVERAGE
          tags:
          - tag: Application
            value: replication
          - tag: Resource type
            value: '{#RESOURCE_TYPE}'
          - tag: Replication role
            value: '{#ROLE}'
        tags:
