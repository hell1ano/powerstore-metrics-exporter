zabbix_export:
  version: '7.0'
  template_groups:
  - name: Templates
    uuid: c5d10813129b44ec8ab3705e3c75d2dc
  host_groups:
  - name: PowerStore NAS
    uuid: 69d4695a178745c387d0df7b0d2a0deb
  templates:
  - discovery_rules:
    - delay: '0'
      item_prototypes:
      - delay: '0'
        key: powerstore.hardware.battery.status[{#APP_ID}_{#BATNAME}]
        master_item:
          key: powerstore.hardware
        name: '({#APP_ID}) Battery [{#BATNAME}]: Status'
        preprocessing:
        - parameters:
          - powerstore_hardware_Battery_state{IP="{$PST_IP}",name="{#BATNAME}",appliance_id="{#APP_ID}"}
          - value
          - ''
          type: PROMETHEUS_PATTERN
        tags:
        - tag: Appliance
          value: '{#APP_ID}'
        - tag: Application
          value: battery
        trigger_prototypes:
        - expression: last(/Dell PowerStore by exporter HTTP/powerstore.hardware.battery.status[{#APP_ID}_{#BATNAME}])<>1
          manual_close: 'YES'
          name: '({#APP_ID}) Battery [{#BATNAME}]: Status is abnormal'
          priority: AVERAGE
          uuid: 413c8d2baf5745be9d83393363c71489
        type: DEPENDENT
        uuid: d2c1eef2af9341c597f0fab6989d135c
        value_type: FLOAT
        valuemap:
          name: Hardware Status Value Mapping
      key: powerstore.battery.discovery
      lld_macro_paths:
      - lld_macro: '{#APP_ID}'
        path: $.labels["appliance_id"]
      - lld_macro: '{#BATNAME}'
        path: $.labels["name"]
      - lld_macro: '{#HELP}'
        path: $["help"]
      - lld_macro: '{#NAME}'
        path: $["name"]
      master_item:
        key: powerstore.hardware
      name: Battery Discovery
      preprocessing:
      - parameters:
        - '{__name__=~"^powerstore_hardware_Battery_state",IP="{$PST_IP}"}'
        type: PROMETHEUS_TO_JSON
      type: DEPENDENT
      uuid: feb65b0d4376460d8a6d338a3103096a
    - delay: '0'
      item_prototypes:
      - delay: 12h
        key: forecast.30d.capacity.used.[{#APP_ID}]
        name: 'Appliance [{#APP_ID}]: Forecast 30d capacity used'
        params: forecast(//powerstore.capacity.last.physical.used_GB.[{#APP_ID}],30d,30d)
        tags:
        - tag: Appliance
          value: '{#APP_ID}'
        - tag: Application
          value: capacity
        - tag: Application
          value: forecast
        type: CALCULATED
        units: '!GB'
        uuid: b4a3acfc06834f9790dc6aebe776df40
        value_type: FLOAT
      - delay: 12h
        key: forecast.60d.capacity.used.[{#APP_ID}]
        name: 'Appliance [{#APP_ID}]: Forecast 60d capacity used'
        params: forecast(//powerstore.capacity.last.physical.used_GB.[{#APP_ID}],60d,60d)
        tags:
        - tag: Appliance
          value: '{#APP_ID}'
        - tag: Application
          value: capacity
        - tag: Application
          value: forecast
        type: CALCULATED
        units: '!GB'
        uuid: 066fbfc28ca643c2901689749fd90f8a
        value_type: FLOAT
      - delay: '0'
