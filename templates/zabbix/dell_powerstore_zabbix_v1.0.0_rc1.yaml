      - uuid: 4bc0e7c063114991b4256eff8ff39c97
        name: 'Replication {#RESOURCE_TYPE} [{#LOCAL_RESOURCE_ID}]: State'
        type: DEPENDENT
        key: powerstore.nas.replication.state[{#SESSION_ID}]
        delay: '0'
