  - description: Discovered source NAS host. Metrics route by stable NAS name identity across arrays. Collector
      health is conservative array-wide health. Import with the NAS discovery template; do not link manually to
      array hosts.
    discovery_rules:
    - delay: '0'
      item_prototypes:
      - delay: '0'
        key: file.size.total.[{#FILEID}]
        master_item:
          key: powerstore.file
        name: File [{#NASNAME} / {#FILENAME}]:Size Total
        preprocessing:
        - parameters:
          - powerstore_filesystem_logical_provisioned{file_system_id="{#FILEID}"}
          - value
          - ''
          type: PROMETHEUS_PATTERN
        tags:
        - tag: NAS
          value: '{#NASNAME}'
        - tag: Filesystem
          value: '{#FILENAME}'
        - tag: Application
          value: filesystem
        type: DEPENDENT
        units: B
        uuid: f2e3d0f53abd419486a2963b0c9c7b54
        value_type: FLOAT
      - delay: '0'
        key: file.size.used.[{#FILEID}]
        master_item:
          key: powerstore.file
        name: File [{#NASNAME} / {#FILENAME}]:Size Used
        preprocessing:
        - parameters:
          - powerstore_filesystem_logical_used{file_system_id="{#FILEID}"}
          - value
          - ''
          type: PROMETHEUS_PATTERN
        tags:
        - tag: NAS
          value: '{#NASNAME}'
        - tag: Filesystem
          value: '{#FILENAME}'
        - tag: Application
          value: filesystem
        type: DEPENDENT
        units: B
        uuid: edf386b469774d49a5ec904a3828536e
        value_type: FLOAT
      - uuid: ec559a0e72d0466086854ad3777c026b
        name: 'File [{#NASNAME} / {#FILENAME}]: Capacity Used %'
        type: CALCULATED
        key: file.size.used.percent.[{#FILEID}]
        value_type: FLOAT
        units: '%'
        delay: 5m
        params: 100*last(//file.size.used.[{#FILEID}])/last(//file.size.total.[{#FILEID}])
        tags:
        - tag: NAS
          value: '{#NASNAME}'
        - tag: Filesystem
          value: '{#FILENAME}'
        - tag: Application
          value: filesystem
