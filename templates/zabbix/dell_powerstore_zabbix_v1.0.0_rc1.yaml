          or actual RPO from this item alone.
        type: DEPENDENT
        key: powerstore.block.replication.next.sync.timestamp[{#SESSION_ID}]
        delay: '0'
        value_type: FLOAT
        units: unixtime
        master_item:
          key: powerstore.cluster
        preprocessing:
        - type: PROMETHEUS_PATTERN
          parameters:
          - powerstore_replication_session_next_sync_timestamp_seconds{IP="{$PST_IP}",session_id="{#SESSION_ID}"}
          - value
          - ''
          error_handler: DISCARD_VALUE
        tags:
        - tag: Application
          value: replication
        - tag: Resource type
          value: '{#RESOURCE_TYPE}'
        - tag: Replication role
          value: '{#ROLE}'
        - tag: Resource ID
          value: '{#LOCAL_RESOURCE_ID}'
      filter:
        evaltype: AND
        conditions:
        - macro: '{#RESOURCE_TYPE}'
          value: ^(volume|volume_group)$
          operator: MATCHES_REGEX
          formulaid: A
        - macro: '{#ROLE}'
          value: ^(Source|Metro_Preferred|Metro_Non_Preferred)$
          operator: MATCHES_REGEX
          formulaid: B
      description: Discover block replication sessions (volume and volume_group) on PowerStore. Configured RPO,
        availability, alert threshold, and sync timestamps are informational. This template does not claim actual
        RPO compliance or detect precisely one/two missed async syncs.
