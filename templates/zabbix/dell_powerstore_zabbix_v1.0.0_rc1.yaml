    macros:
    - macro: '{$POWERSTORE.IDLE.PERIOD}'
      value: 24h
      description: Rolling zero-average IOPS window. Keep item history longer than this period; adjust minimum samples
        if changing the window.
    - macro: '{$POWERSTORE.IDLE.MIN.SAMPLES}'
      value: '288'
      description: Minimum samples in the inactivity window. Default 288 assumes 24 hours at five-minute polling;
        use 576 for 48h or 72 for 6h. Adjust if polling changes.
    - macro: '{$POWERSTORE.EXPORTER.URL}'
      value: http://127.0.0.1:9010
      description: Exporter base URL, without trailing slash. Use https:// and a certificate hostname when TLS is
        enabled.
    - macro: '{$PST_IP}'
      value: 10.0.0.1
      description: Array address exactly as configured in exporter storageList.
    - macro: '{$POWERSTORE.NODATA}'
      value: 30m
      description: No usable collector health received within this interval.
    - macro: '{$POWERSTORE.BULK.MAX.AGE}'
      value: '900'
      description: Maximum seconds since successful bulk refresh; align with exporter bulkMaxAge.
    - macro: '{$POWERSTORE.PORT.MATCHES}'
      value: .*
      description: Regex matching ports to monitor.
    - macro: '{$POWERSTORE.PORT.NOT_MATCHES}'
      value: CHANGE_THIS
      description: Regex excluding intentionally unused ports.
    - macro: '{$POWERSTORE.CAPACITY.WARN}'
      value: '80'
      description: Physical capacity warning percent.
    - macro: '{$POWERSTORE.CAPACITY.HIGH}'
      value: '90'
      description: Physical capacity high percent.
    - macro: '{$POWERSTORE.CAPACITY.DISASTER}'
      value: '95'
      description: Physical capacity disaster percent.
    - macro: '{$POWERSTORE.LATENCY.WARN}'
      value: '20'
      description: Appliance latency warning threshold (ms), 5-minute average.
    - macro: '{$POWERSTORE.NAS.DISCOVERY.INTERVAL}'
      value: 15m
      description: Interval for NAS host inventory discovery on this PowerStore.
    - macro: '{$POWERSTORE.NAME}'
      value: PowerStore
      description: Display name of the PowerStore array for discovered NAS hosts. Override on each PowerStore host
        to match its Zabbix host name or cluster name.
    - macro: '{$POWERSTORE.LATENCY.HIGH}'
      value: '50'
      description: Appliance latency high threshold (ms), 5-minute average.
