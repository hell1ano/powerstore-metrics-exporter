        master_item:
          key: powerstore.capacity.last.physical.used.[{#APP_ID}]
        name: Appliance [{#APP_ID}]:Last Physical Used GB
        preprocessing:
        - parameters:
          - '0.00098'
          type: MULTIPLIER
        - parameters:
          - '0.00098'
          type: MULTIPLIER
        - parameters:
          - '0.00098'
          type: MULTIPLIER
        tags:
        - tag: Appliance
          value: '{#APP_ID}'
        - tag: Application
