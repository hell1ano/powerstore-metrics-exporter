      type: DEPENDENT
      uuid: 95610b50074d44b2a8b78e0daa3f01ef
    - delay: '0'
      item_prototypes:
      - delay: '0'
        key: powerstore.ethport.currentspeed[{#APP_ID}_{#ETHNAME}]
