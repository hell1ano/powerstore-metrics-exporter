                - delay: "0"
                  key: powerstore.nas.server.status.[{#NASNAME}]
                  master_item:
                    key: powerstore.nas
                  name: Nas [{#NASNAME}]:Server Status
                  preprocessing:
                    - parameters:
                        - powerstore_nas_server_operational_status{name="{#NASNAME}"}
                        - value
                        - ""
                      type: PROMETHEUS_PATTERN
                  tags:
                    - tag: Application
                      value: nas
                  trigger_prototypes:
                    - expression: last(/Dell PowerStore NAS by exporter HTTP/powerstore.nas.server.status.[{#NASNAME}])<>1
                      name: 'PowerStore: NAS [{#NASNAME}] is not started'
                      priority: AVERAGE
                      uuid: e949257935235d888f493e01968ca428
                  type: DEPENDENT
                  uuid: 44ad0c0d7d615db8a9ea8f6ab7b720cb
