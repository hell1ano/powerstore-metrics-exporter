zabbix_export:
    host_groups:
        - name: PowerStore NAS
          uuid: 7cf05697989351d7bb3e9df822c4792b
    template_groups:
        - name: Templates
          uuid: c5d10813129b44ec8ab3705e3c75d2dc
    templates:
        - description: Discovered source NAS host. Metrics route by stable NAS name identity across arrays. Collector health is conservative array-wide health. Import with the NAS discovery template; do not link manually to array hosts.
          discovery_rules:
            - delay: "0"
              item_prototypes:
                - delay: "0"
                  key: file.size.total.[{#FILEID}]
                  master_item:
                    key: powerstore.file
                  name: File [{#NASNAME} / {#FILENAME}]:Size Total
                  preprocessing:
                    - parameters:
                        - powerstore_filesystem_logical_provisioned{file_system_id="{#FILEID}"}
                        - value
                        - ""
                      type: PROMETHEUS_PATTERN
                  tags:
                    - tag: NAS
                      value: '{#NASNAME}'
                    - tag: NAS ID
                      value: '{#NASID}'
                    - tag: Filesystem ID
                      value: '{#FILEID}'
                    - tag: Application
                      value: filesystem
                  type: DEPENDENT
                  units: B
                  uuid: 228367381e925be291816f7ec28d6eb8
                  value_type: FLOAT
                - delay: "0"
                  key: file.size.used.[{#FILEID}]
                  master_item:
                    key: powerstore.file
                  name: File [{#NASNAME} / {#FILENAME}]:Size Used
                  preprocessing:
                    - parameters:
                        - powerstore_filesystem_logical_used{file_system_id="{#FILEID}"}
                        - value
                        - ""
                      type: PROMETHEUS_PATTERN
                  tags:
                    - tag: NAS
                      value: '{#NASNAME}'
                    - tag: NAS ID
                      value: '{#NASID}'
                    - tag: Filesystem ID
                      value: '{#FILEID}'
                    - tag: Application
                      value: filesystem
                  type: DEPENDENT
                  units: B
                  uuid: c45af5d0bba1504d8f7d900cca7b1dc8
                  value_type: FLOAT
              key: powerstore.filesystem.discovery
              lld_macro_paths:
                - lld_macro: '{#FILENAME}'
                  path: $.labels["name"]
                - lld_macro: '{#FILEID}'
                  path: $.labels["file_system_id"]
                - lld_macro: '{#NASID}'
                  path: $.labels["nas_server_id"]
                - lld_macro: '{#NASNAME}'
                  path: $.labels["nas_server_name"]
                - lld_macro: '{#HELP}'
                  path: $["help"]
                - lld_macro: '{#NAME}'
                  path: $["name"]
              master_item:
                key: powerstore.file
              name: FileSystem Discovery
              preprocessing:
                - parameters:
                    - '{__name__=~"^powerstore_filesystem_logical_provisioned"}'
                  type: PROMETHEUS_TO_JSON
              type: DEPENDENT
              uuid: 9029670012135122bf8ed4f71407d81d
            - delay: "0"
