zabbix_export:
  templates:
    - discovery_rules:
        - delay: "0"
          item_prototypes:
            - delay: "0"
              key: "powerstore.hardware.battery.status[{#APP_ID}_{#BATNAME}]"
              master_item:
                key: "powerstore.hardware"
              name: "({#APP_ID}) Battery [{#BATNAME}]: Status"
              preprocessing:
                - parameters:
                    - "powerstore_hardware_Battery_state{IP=\"{$PST_IP}\",name=\"{#BATNAME}\",appliance_id=\"{#APP_ID}\"}"
                    - "value"
                    - ""
                  type: "PROMETHEUS_PATTERN"
              tags:
                - tag: "Appliance"
                  value: "{#APP_ID}"
                - tag: "Application"
                  value: "battery"
              trigger_prototypes:
                - expression: "last(/Dell PowerStore by exporter HTTP/powerstore.hardware.battery.status[{#APP_ID}_{#BATNAME}])<>1"
                  manual_close: "YES"
                  name: "({#APP_ID}) Battery [{#BATNAME}]: Status is abnormal"
                  priority: "AVERAGE"
                  uuid: "93d9c44604bf49a984783d72cc06179c"
              type: "DEPENDENT"
              uuid: "0c855d736c9b477fadab3179a056791e"
              value_type: "FLOAT"
              valuemap:
                name: "Hardware Status Value Mapping"
          key: "powerstore.battery.discovery"
          lld_macro_paths:
            - lld_macro: "{#APP_ID}"
              path: "$.labels[\"appliance_id\"]"
            - lld_macro: "{#BATNAME}"
              path: "$.labels[\"name\"]"
            - lld_macro: "{#HELP}"
              path: "$[\"help\"]"
            - lld_macro: "{#NAME}"
              path: "$[\"name\"]"
          master_item:
            key: "powerstore.hardware"
          name: "Battery Discovery"
          preprocessing:
            - parameters:
                - "{__name__=~\"^powerstore_hardware_Battery_state\",IP=\"{$PST_IP}\"}"
              type: "PROMETHEUS_TO_JSON"
          type: "DEPENDENT"
          uuid: "045ed653a31b4962b661263e35aed38a"
        - delay: "0"
          item_prototypes:
            - delay: "12h"
              key: "forecast.30d.capacity.used.[{#APP_ID}]"
              name: "Appliance [{#APP_ID}]: Forecast 30d capacity used"
              params: "forecast(//powerstore.capacity.last.physical.used_GB.[{#APP_ID}],30d,30d)"
              tags:
                - tag: "Appliance"
                  value: "{#APP_ID}"
                - tag: "Application"
                  value: "capacity"
                - tag: "Application"
                  value: "forecast"
              type: "CALCULATED"
              units: "!GB"
              uuid: "88d6d6e870894558a3ad5c962b140cc2"
              value_type: "FLOAT"
            - delay: "12h"
              key: "forecast.60d.capacity.used.[{#APP_ID}]"
              name: "Appliance [{#APP_ID}]: Forecast 60d capacity used"
              params: "forecast(//powerstore.capacity.last.physical.used_GB.[{#APP_ID}],60d,60d)"
              tags:
                - tag: "Appliance"
                  value: "{#APP_ID}"
                - tag: "Application"
                  value: "capacity"
                - tag: "Application"
                  value: "forecast"
              type: "CALCULATED"
              units: "!GB"
              uuid: "771aa3f8c6ad45db8820b224e55fab79"
              value_type: "FLOAT"
            - delay: "0"
              key: "powerstore.capacity.last.data.physical.used.[{#APP_ID}]"
              master_item:
                key: "powerstore.capacity"
              name: "Appliance [{#APP_ID}]:Last Data Physical Used"
              preprocessing:
                - parameters:
                    - "powerstore_cap_last_data_physical_used{IP=\"{$PST_IP}\",appliance_id=\"{#APP_ID}\"}"
                    - "value"
                    - ""
                  type: "PROMETHEUS_PATTERN"
              tags:
                - tag: "Appliance"
                  value: "{#APP_ID}"
                - tag: "Application"
                  value: "capacity"
              type: "DEPENDENT"
              units: "B"
              uuid: "e1079379944e4fe790b6e20cf5b2135d"
              value_type: "FLOAT"
            - delay: "0"
              key: "powerstore.capacity.last.data.reduction[{#APP_ID}]"
              master_item:
                key: "powerstore.capacity"
              name: "Appliance [{#APP_ID}]:Last Data Reduction"
              preprocessing:
                - parameters:
                    - "powerstore_cap_last_data_reduction{IP=\"{$PST_IP}\",appliance_id=\"{#APP_ID}\"}"
                    - "value"
                    - ""
                  type: "PROMETHEUS_PATTERN"
              tags:
                - tag: "Appliance"
                  value: "{#APP_ID}"
                - tag: "Application"
                  value: "capacity"
              type: "DEPENDENT"
              units: "%"
              uuid: "c58c532811244d1a9bd34af9c312f2cf"
              value_type: "FLOAT"
            - delay: "0"
              key: "powerstore.capacity.last.efficiency.ratio.[{#APP_ID}]"
              master_item:
                key: "powerstore.capacity"
              name: "Appliance [{#APP_ID}]:Last Efficiency Ratio"
              preprocessing:
                - parameters:
                    - "powerstore_cap_last_efficiency_ratio{IP=\"{$PST_IP}\",appliance_id=\"{#APP_ID}\"}"
                    - "value"
                    - ""
                  type: "PROMETHEUS_PATTERN"
              tags:
                - tag: "Appliance"
                  value: "{#APP_ID}"
                - tag: "Application"
                  value: "capacity"
              type: "DEPENDENT"
              units: ":1"
              uuid: "57517c587f9c4bdea8004276a600d12d"
              value_type: "FLOAT"
            - delay: "10m"
              key: "powerstore.capacity.last.logical.percent.used.[{#APP_ID}]"
              name: "Appliance [{#APP_ID}]: Last Logical Percent Used"
              params: "100*(last(//powerstore.capacity.last.logical.used.[{#APP_ID}])/last(//powerstore.capacity.last.logical.provisioned.[{#APP_ID}]))"
              tags:
                - tag: "Appliance"
                  value: "{#APP_ID}"
                - tag: "Application"
                  value: "capacity"
              type: "CALCULATED"
              units: "%"
              uuid: "a9454b5842554a349feae63c8d160e4d"
              value_type: "FLOAT"
            - delay: "0"
              key: "powerstore.capacity.last.logical.provisioned.[{#APP_ID}]"
              master_item:
                key: "powerstore.capacity"
              name: "Appliance [{#APP_ID}]:Last Logical Provisioned"
              preprocessing:
                - parameters:
                    - "powerstore_cap_last_logical_provisioned{IP=\"{$PST_IP}\",appliance_id=\"{#APP_ID}\"}"
                    - "value"
                    - ""
                  type: "PROMETHEUS_PATTERN"
              tags:
                - tag: "Appliance"
                  value: "{#APP_ID}"
                - tag: "Application"
                  value: "capacity"
              type: "DEPENDENT"
              units: "B"
              uuid: "ac75c26261a5453fb28f6ebab94ff307"
              value_type: "FLOAT"
            - delay: "0"
              key: "powerstore.capacity.last.logical.used.[{#APP_ID}]"
              master_item:
                key: "powerstore.capacity"
              name: "Appliance [{#APP_ID}]:Last Logical Used"
              preprocessing:
                - parameters:
                    - "powerstore_cap_last_logical_used{IP=\"{$PST_IP}\",appliance_id=\"{#APP_ID}\"}"
                    - "value"
                    - ""
                  type: "PROMETHEUS_PATTERN"
              tags:
                - tag: "Appliance"
                  value: "{#APP_ID}"
                - tag: "Application"
                  value: "capacity"
              type: "DEPENDENT"
              units: "B"
              uuid: "e68ba6beec3849a9806d4db77c010d16"
              value_type: "FLOAT"
            - delay: "5m"
              key: "powerstore.capacity.last.physical.free.[{#APP_ID}]"
              name: "Appliance [{#APP_ID}]:Last Physical Free"
              params: "last(//powerstore.capacity.last.physical.total.[{#APP_ID}])-last(//powerstore.capacity.last.physical.used.[{#APP_ID}])"
              tags:
                - tag: "Appliance"
                  value: "{#APP_ID}"
                - tag: "Application"
                  value: "capacity"
              type: "CALCULATED"
              units: "B"
              uuid: "5f322ba3f64749a08a313a7167e969d2"
              value_type: "FLOAT"
            - delay: "10m"
              key: "powerstore.capacity.last.physical.percent.used.[{#APP_ID}]"
              name: "Appliance [{#APP_ID}]:Last Physical Percent Used"
              params: "100*(last(//powerstore.capacity.last.physical.used.[{#APP_ID}])/last(//powerstore.capacity.last.physical.total.[{#APP_ID}]))"
              tags:
                - tag: "Appliance"
                  value: "{#APP_ID}"
                - tag: "Application"
                  value: "capacity"
              trigger_prototypes:
                - dependencies:
                    - expression: "last(/Dell PowerStore by exporter HTTP/powerstore.capacity.last.physical.percent.used.[{#APP_ID}])>={$POWERSTORE.CAPACITY.HIGH}"
                      name: "Appliance [{#APP_ID}] Physical Capacity Used Over 90%"
                    - expression: "last(/Dell PowerStore by exporter HTTP/powerstore.capacity.last.physical.percent.used.[{#APP_ID}])>={$POWERSTORE.CAPACITY.DISASTER}"
                      name: "Appliance [{#APP_ID}] Physical Capacity Used Over 95%"
                  expression: "last(/Dell PowerStore by exporter HTTP/powerstore.capacity.last.physical.percent.used.[{#APP_ID}])>={$POWERSTORE.CAPACITY.WARN}"
                  manual_close: "YES"
                  name: "Appliance [{#APP_ID}] Physical Capacity Used Over 80%"
                  priority: "WARNING"
                  uuid: "74ad1d3fb3414436adda862976ad325f"
                - dependencies:
                    - expression: "last(/Dell PowerStore by exporter HTTP/powerstore.capacity.last.physical.percent.used.[{#APP_ID}])>={$POWERSTORE.CAPACITY.DISASTER}"
                      name: "Appliance [{#APP_ID}] Physical Capacity Used Over 95%"
                  expression: "last(/Dell PowerStore by exporter HTTP/powerstore.capacity.last.physical.percent.used.[{#APP_ID}])>={$POWERSTORE.CAPACITY.HIGH}"
                  manual_close: "YES"
                  name: "Appliance [{#APP_ID}] Physical Capacity Used Over 90%"
                  priority: "AVERAGE"
                  uuid: "5672955522324aa58045b6e6d4a43a81"
                - expression: "last(/Dell PowerStore by exporter HTTP/powerstore.capacity.last.physical.percent.used.[{#APP_ID}])>={$POWERSTORE.CAPACITY.DISASTER}"
                  manual_close: "YES"
                  name: "Appliance [{#APP_ID}] Physical Capacity Used Over 95%"
                  priority: "DISASTER"
                  uuid: "425d22618ae141389595ed2e54740440"
              type: "CALCULATED"
              units: "%"
              uuid: "715d1a3b13d54252b46016bd452c1e1a"
              value_type: "FLOAT"
            - delay: "0"
              key: "powerstore.capacity.last.physical.total.[{#APP_ID}]"
              master_item:
                key: "powerstore.capacity"
              name: "Appliance [{#APP_ID}]:Last Physical Total"
              preprocessing:
                - parameters:
                    - "powerstore_cap_last_physical_total{IP=\"{$PST_IP}\",appliance_id=\"{#APP_ID}\"}"
                    - "value"
                    - ""
                  type: "PROMETHEUS_PATTERN"
              tags:
                - tag: "Appliance"
                  value: "{#APP_ID}"
                - tag: "Application"
                  value: "capacity"
              type: "DEPENDENT"
              units: "B"
              uuid: "2ad0827e86b0419abce99f544dcf9a44"
              value_type: "FLOAT"
            - delay: "0"
              key: "powerstore.capacity.last.physical.used.[{#APP_ID}]"
              master_item:
                key: "powerstore.capacity"
              name: "Appliance [{#APP_ID}]:Last Physical Used"
              preprocessing:
                - parameters:
                    - "powerstore_cap_last_physical_used{IP=\"{$PST_IP}\",appliance_id=\"{#APP_ID}\"}"
                    - "value"
                    - ""
                  type: "PROMETHEUS_PATTERN"
              tags:
                - tag: "Appliance"
                  value: "{#APP_ID}"
                - tag: "Application"
                  value: "capacity"
              type: "DEPENDENT"
              units: "B"
              uuid: "3bee270f981b4c8da021c4ef7a7a557b"
              value_type: "FLOAT"
            - delay: "0"
              key: "powerstore.capacity.last.physical.used_GB.[{#APP_ID}]"
              master_item:
                key: "powerstore.capacity.last.physical.used.[{#APP_ID}]"
              name: "Appliance [{#APP_ID}]:Last Physical Used GB"
              preprocessing:
                - parameters:
                    - "0.00098"
                  type: "MULTIPLIER"
                - parameters:
                    - "0.00098"
                  type: "MULTIPLIER"
                - parameters:
                    - "0.00098"
                  type: "MULTIPLIER"
              tags:
                - tag: "Appliance"
                  value: "{#APP_ID}"
                - tag: "Application"
                  value: "capacity"
              type: "DEPENDENT"
              units: "!GB"
              uuid: "fd6060b476bb4665bc2394eb775e5bb4"
              value_type: "FLOAT"
            - delay: "0"
              key: "powerstore.capacity.last.shared.logical.used.[{#APP_ID}]"
              master_item:
                key: "powerstore.capacity"
              name: "Appliance [{#APP_ID}]:Last Shared Logical Used"
              preprocessing:
                - parameters:
                    - "powerstore_cap_last_shared_logical_used{IP=\"{$PST_IP}\",appliance_id=\"{#APP_ID}\"}"
                    - "value"
                    - ""
                  type: "PROMETHEUS_PATTERN"
              tags:
                - tag: "Appliance"
                  value: "{#APP_ID}"
                - tag: "Application"
                  value: "capacity"
              type: "DEPENDENT"
              units: "B"
              uuid: "f33b59c5a8994d1ba06679c57f74001e"
              value_type: "FLOAT"
            - delay: "0"
              key: "powerstore.capacity.last.thin.savings.[{#APP_ID}]"
              master_item:
                key: "powerstore.capacity"
              name: "Appliance [{#APP_ID}]:Last Thin Savings"
              preprocessing:
                - parameters:
                    - "powerstore_cap_last_thin_savings{IP=\"{$PST_IP}\",appliance_id=\"{#APP_ID}\"}"
                    - "value"
                    - ""
                  type: "PROMETHEUS_PATTERN"
              tags:
                - tag: "Appliance"
                  value: "{#APP_ID}"
                - tag: "Application"
                  value: "capacity"
              type: "DEPENDENT"
              units: "%"
              uuid: "e65dce8cbf5049a295f2959ae856797c"
              value_type: "FLOAT"
          key: "powerstore.capacity.discovery"
          lld_macro_paths:
            - lld_macro: "{#APP_ID}"
              path: "$.labels[\"appliance_id\"]"
            - lld_macro: "{#HELP}"
              path: "$[\"help\"]"
            - lld_macro: "{#NAME}"
              path: "$[\"name\"]"
          master_item:
            key: "powerstore.capacity"
          name: "Capacity Discovery"
          preprocessing:
            - parameters:
                - "{__name__=~\"^powerstore_cap_last_logical_provisioned\",IP=\"{$PST_IP}\"}"
              type: "PROMETHEUS_TO_JSON"
          type: "DEPENDENT"
          uuid: "61193168b6e5436795021b31873b64a9"
        - delay: "0"
          item_prototypes:
            - delay: "0"
              key: "powerstore.hardware.drives.life-cycle[{#APP_ID}_{#DRIVENAME}]"
              master_item:
                key: "powerstore.hardware"
              name: "({#APP_ID}) Drives [{#DRIVENAME}]: life-cycle"
              preprocessing:
                - parameters:
                    - "powerstore_wear_metrics_by_drive{IP=\"{$PST_IP}\",name=\"{#DRIVENAME}\",appliance_id=\"{#APP_ID}\"}"
                    - "value"
                    - ""
                  type: "PROMETHEUS_PATTERN"
              tags:
                - tag: "Appliance"
                  value: "{#APP_ID}"
                - tag: "Application"
                  value: "driver"
              trigger_prototypes:
                - expression: "last(/Dell PowerStore by exporter HTTP/powerstore.hardware.drives.life-cycle[{#APP_ID}_{#DRIVENAME}])<=20"
                  manual_close: "YES"
                  name: "({#APP_ID}) Drives [{#DRIVENAME}]: Disk Residual Erase Ratio Less than 20%"
                  priority: "WARNING"
                  uuid: "b4b01ff8674a4be2b7b904402e9887a8"
              type: "DEPENDENT"
              units: "%"
              uuid: "77e78cdfcf5f4616a3864d91973c55ff"
              value_type: "FLOAT"
            - delay: "0"
              key: "powerstore.hardware.drives.size[{#APP_ID}_{#DRIVENAME}]"
              master_item:
                key: "powerstore.hardware"
              name: "({#APP_ID}) Drives [{#DRIVENAME}]: Size"
              preprocessing:
                - parameters:
                    - "powerstore_hardware_drive_size{IP=\"{$PST_IP}\",name=\"{#DRIVENAME}\",appliance_id=\"{#APP_ID}\"}"
                    - "value"
                    - ""
                  type: "PROMETHEUS_PATTERN"
              tags:
                - tag: "Appliance"
                  value: "{#APP_ID}"
                - tag: "Application"
                  value: "driver"
              type: "DEPENDENT"
              units: "B"
              uuid: "7528cd51a80d4cdfb1bf367279c2d407"
              value_type: "FLOAT"
            - delay: "0"
              key: "powerstore.hardware.drives.status[{#APP_ID}_{#DRIVENAME}]"
              master_item:
                key: "powerstore.hardware"
              name: "({#APP_ID}) Drives [{#DRIVENAME}]: Status"
              preprocessing:
                - parameters:
                    - "powerstore_hardware_Drive_state{IP=\"{$PST_IP}\",name=\"{#DRIVENAME}\",appliance_id=\"{#APP_ID}\"}"
                    - "value"
                    - ""
                  type: "PROMETHEUS_PATTERN"
              tags:
                - tag: "Appliance"
                  value: "{#APP_ID}"
                - tag: "Application"
                  value: "driver"
              trigger_prototypes:
                - expression: "last(/Dell PowerStore by exporter HTTP/powerstore.hardware.drives.status[{#APP_ID}_{#DRIVENAME}])<>1"
                  manual_close: "YES"
                  name: "({#APP_ID}) Drives [{#DRIVENAME}] Status is abnormal"
                  priority: "AVERAGE"
                  uuid: "445ef6ef90164a53a91ebf0f6b8a80a1"
              type: "DEPENDENT"
              uuid: "dcaa83edecf14d0b947e0687039038e5"
              value_type: "FLOAT"
              valuemap:
                name: "Hardware Status Value Mapping"
            - delay: "0"
              key: "powerstore.hardware.drives.type[{#APP_ID}_{#DRIVENAME}]"
              master_item:
                key: "powerstore.hardware"
              name: "({#APP_ID}) Drives [{#DRIVENAME}]: Type"
              preprocessing:
                - parameters:
                    - "powerstore_hardware_drive_size{IP=\"{$PST_IP}\",name=\"{#DRIVENAME}\",appliance_id=\"{#APP_ID}\"}"
                    - "label"
                    - "drive_type"
                  type: "PROMETHEUS_PATTERN"
              tags:
                - tag: "Appliance"
                  value: "{#APP_ID}"
                - tag: "Application"
                  value: "driver"
              trends: "0"
              type: "DEPENDENT"
              uuid: "1382c7f145874bdcb4a5384795db063f"
              value_type: "TEXT"
          key: "powerstore.drives.discovery"
          lld_macro_paths:
            - lld_macro: "{#APP_ID}"
              path: "$.labels[\"appliance_id\"]"
            - lld_macro: "{#DRIVENAME}"
              path: "$.labels[\"name\"]"
            - lld_macro: "{#HELP}"
              path: "$[\"help\"]"
            - lld_macro: "{#NAME}"
              path: "$[\"name\"]"
          master_item:
            key: "powerstore.hardware"
          name: "Drives Discovery"
          preprocessing:
            - parameters:
                - "{__name__=~\"^powerstore_hardware_drive_size\",IP=\"{$PST_IP}\"}"
              type: "PROMETHEUS_TO_JSON"
          type: "DEPENDENT"
          uuid: "49bd329a26f54c71ac95a1789d3f9459"
        - delay: "0"
          item_prototypes:
            - delay: "0"
              key: "powerstore.ethport.currentspeed[{#APP_ID}_{#ETHNAME}]"
              master_item:
                key: "powerstore.port"
              name: "({#APP_ID}) EthPort [{#ETHNAME}]: CurrentSpeed"
              preprocessing:
                - parameters:
                    - "powerstore_eth_port_current_speed{IP=\"{$PST_IP}\",appliance_id=\"{#APP_ID}\",eth_port_id=\"{#ETHNAME}\"}"
                    - "value"
                    - ""
                  type: "PROMETHEUS_PATTERN"
              tags:
                - tag: "Appliance"
                  value: "{#APP_ID}"
                - tag: "Application"
                  value: "ethport"
              type: "DEPENDENT"
              units: "Gps"
              uuid: "4408f4dc1762485788f30514b95bd8e7"
            - delay: "0"
              key: "powerstore.ethport.islinkup.[{#APP_ID}_{#ETHNAME}]"
              master_item:
                key: "powerstore.port"
              name: "({#APP_ID}) EthPort [{#ETHNAME}]: Is Link Up"
              preprocessing:
                - parameters:
                    - "powerstore_eth_port_is_link_up{IP=\"{$PST_IP}\",appliance_id=\"{#APP_ID}\",eth_port_id=\"{#ETHNAME}\"}"
                    - "value"
                    - ""
                  type: "PROMETHEUS_PATTERN"
              tags:
                - tag: "Appliance"
                  value: "{#APP_ID}"
                - tag: "Application"
                  value: "ethport"
              trigger_prototypes:
                - expression: "last(/Dell PowerStore by exporter HTTP/powerstore.ethport.islinkup.[{#APP_ID}_{#ETHNAME}])<>1"
                  manual_close: "YES"
                  name: "({#APP_ID}) EthPort [{#ETHNAME}] Link status is abnormal"
                  priority: "WARNING"
                  uuid: "d6cef21d94994ad19bd22e31f4aacde0"
              type: "DEPENDENT"
              uuid: "9d3ed24fd5c74d38b2f019f224c74f59"
              valuemap:
                name: "Port Link Value Mapping"
          key: "powerstore.ethport.discovery"
          lld_macro_paths:
            - lld_macro: "{#APP_ID}"
              path: "$.labels[\"appliance_id\"]"
            - lld_macro: "{#ETHNAME}"
              path: "$.labels[\"eth_port_id\"]"
            - lld_macro: "{#HELP}"
              path: "$[\"help\"]"
            - lld_macro: "{#NAME}"
              path: "$[\"name\"]"
          master_item:
            key: "powerstore.port"
          name: "EthPort Discovery"
          preprocessing:
            - parameters:
                - "{__name__=~\"^powerstore_eth_port_is_link_up\",IP=\"{$PST_IP}\"}"
              type: "PROMETHEUS_TO_JSON"
          type: "DEPENDENT"
          uuid: "03a8d623b85c4c25bfeb9448a24b981a"
          filter:
            evaltype: "AND"
            conditions:
              - macro: "{#ETHNAME}"
                value: "{$POWERSTORE.PORT.MATCHES}"
                operator: "MATCHES_REGEX"
                formulaid: "A"
              - macro: "{#ETHNAME}"
                value: "{$POWERSTORE.PORT.NOT_MATCHES}"
                operator: "NOT_MATCHES_REGEX"
                formulaid: "B"
        - delay: "0"
          item_prototypes:
            - delay: "0"
              key: "powerstore.hardware.fan.status[{#APP_ID}_{#FANNAME}]"
              master_item:
                key: "powerstore.hardware"
              name: "({#APP_ID}) Fan [{#FANNAME}]: Status"
              preprocessing:
                - parameters:
                    - "powerstore_hardware_Fan_state{IP=\"{$PST_IP}\",name=\"{#FANNAME}\",appliance_id=\"{#APP_ID}\"}"
                    - "value"
                    - ""
                  type: "PROMETHEUS_PATTERN"
              tags:
                - tag: "Appliance"
                  value: "{#APP_ID}"
                - tag: "Application"
                  value: "fan"
              trigger_prototypes:
                - expression: "last(/Dell PowerStore by exporter HTTP/powerstore.hardware.fan.status[{#APP_ID}_{#FANNAME}])<>1"
                  manual_close: "YES"
                  name: "({#APP_ID}) Fan [{#FANNAME}] Status is abnormal"
                  priority: "AVERAGE"
                  uuid: "9509902c3a96452182115f48eca53ecc"
              type: "DEPENDENT"
              uuid: "cc075d0ea01d403dbfab01feff15d394"
              value_type: "FLOAT"
              valuemap:
                name: "Hardware Status Value Mapping"
          key: "powerstore.fan.discovery"
          lld_macro_paths:
            - lld_macro: "{#APP_ID}"
              path: "$.labels[\"appliance_id\"]"
            - lld_macro: "{#FANNAME}"
              path: "$.labels[\"name\"]"
