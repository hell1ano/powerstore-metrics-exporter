name: Test exporter and Zabbix templates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.23.x', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Test including race detection and template contracts
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -o /tmp/powerstore-metrics-exporter .
